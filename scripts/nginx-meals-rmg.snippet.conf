# Merge into your server {} block. Paths assume repo at /var/www/meals-rmg.
# Backend listens on 127.0.0.1:3000 with global prefix /meals-rmg (auth, lunch, hello).

upstream meals_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Vite hashed assets — must not go to Node
location /meals-rmg/assets/ {
    alias /var/www/meals-rmg/frontend/dist/assets/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# REST API
location ~ ^/meals-rmg/(auth|lunch)(/|$) {
    proxy_pass http://meals_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Socket.IO (path includes MEALS_PUBLIC_PATH=/meals-rmg on the backend)
location ~ ^/meals-rmg/socket\.io {
    proxy_pass http://meals_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

# Normalize bare prefix to SPA entry
location = /meals-rmg {
    return 301 /meals-rmg/;
}

# SPA (React router, /meals-rmg/kitchen, etc.)
location /meals-rmg/ {
    alias /var/www/meals-rmg/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /meals-rmg/index.html;
}
