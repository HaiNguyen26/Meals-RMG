# Merge into your server {} block. Paths assume repo at /var/www/meals-rmg.
# Backend: 127.0.0.1:3000 với setGlobalPrefix('meals-rmg').
#
# QUAN TRỌNG: Dùng ^~ cho API/socket để nginx KHÔNG rơi vào location SPA (alias + try_files)
# — tránh lỗi fetch nhận HTML (<!doctype) thay vì JSON.

upstream meals_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Vite assets (hash) — tĩnh, không qua Node
location ^~ /meals-rmg/assets/ {
    alias /var/www/meals-rmg/frontend/dist/assets/;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# REST — phải đứng TRƯỚC location /meals-rmg/ của SPA
location ^~ /meals-rmg/auth {
    proxy_pass http://meals_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /meals-rmg/lunch {
    proxy_pass http://meals_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Socket.IO (MEALS_PUBLIC_PATH=/meals-rmg trên backend)
location ^~ /meals-rmg/socket.io {
    proxy_pass http://meals_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

location = /meals-rmg {
    return 301 /meals-rmg/;
}

# SPA — đặt CUỐI (chỉ còn route không khớp các khối trên)
location /meals-rmg/ {
    alias /var/www/meals-rmg/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /meals-rmg/index.html;
}
