# Nest phục vụ API + frontend/dist + SPA (SpaStaticModule). Chỉ proxy vào backend.
# Repo: /var/www/meals-rmg — backend listen 127.0.0.1:3000

upstream meals_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

location ^~ /meals-rmg/socket.io {
    proxy_pass http://meals_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

location /meals-rmg/ {
    proxy_pass http://meals_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /meals-rmg {
    return 301 /meals-rmg/;
}
