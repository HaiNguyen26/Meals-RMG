# Nest: REST /meals-rmg/api, SPA + static /meals-rmg/, Socket.IO /meals-rmg/socket.io — proxy toàn bộ /meals-rmg vào Node.
# Repo: /var/www/meals-rmg — backend listen 127.0.0.1:3000
#
# QUAN TRỌNG:
# - Xóa mọi block cũ kiểu alias/try_files tới frontend/dist cho /meals-rmg — nếu không, nginx trả
#   index.html 200 cho /meals-rmg/api/... → lỗi "Expected JSON, got HTML".
# - proxy_pass KHÔNG được có URI path ở cuối (vd sai: http://127.0.0.1:3000/), nếu không URI
#   gửi tới Nest bị cắt mất prefix /meals-rmg.
# - KHÔNG dùng rewrite kiểu: /meals-rmg/api/... → /lunch/... — Nest cần full path /meals-rmg/api/lunch/...
#   Nếu 404 và message nest là "Cannot GET /lunch/..." thì URI đã bị cắt nhầm (mất /meals-rmg/api).

upstream meals_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

location ^~ /meals-rmg/socket.io {
    proxy_pass http://meals_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

# ĐÚNG: proxy_pass chỉ upstream, không thêm / ở cuối
location /meals-rmg/ {
    proxy_pass http://meals_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /meals-rmg {
    return 301 /meals-rmg/;
}
